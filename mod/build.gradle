plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.20'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

loom {
    splitEnvironmentSourceSets()
    runs {
        client {
            vmArg "-Dmayhem.debugshot=1"
            vmArg "-Dmayhem.debugshot.file=" + System.getProperty("shotfile", "debugshot.png")
            vmArg "-Dmayhem.mode=" + System.getProperty("mode", "full")
            vmArg "-Dmayhem.debugshot.cmd=" + System.getProperty("cmd", "")
            vmArg "-Dmayhem.debugshot.frame=" + System.getProperty("shotframe", "300")
            if (System.getProperty("nodepth") != null) vmArg "-Dmayhem.nodepth=1"
        }
    }
    mods {
        "mayhem" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    // A partir da era 26.x o jogo vem sem ofuscacao: nao existe linha de
    // mappings, e loader e API entram como implementation comum.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    def version = project.version
    inputs.property "version", version
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}
